name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, coverage, and configuration
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ci_olist
      DB_USER: ci_user
      DB_PASSWORD: ci_password_not_for_production
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-test-model
      LLM_API_KEY: ci_mock_key_not_used
      API_ALLOWED_ORIGINS: http://localhost:8501
      BACKEND_API_URL: http://localhost:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests with coverage
        run: >-
          python -m pytest -q
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70

      - name: Verify FastAPI import
        run: python -c "from src.api.main import app; assert app.title == 'Enterprise AI SQL Analytics Copilot API'"

      - name: Validate runtime configuration
        run: python scripts/validate_environment.py all

      - name: Validate Docker Compose
        run: docker compose config --quiet

  docker-build:
    name: Build ${{ matrix.component }} image
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile.backend
          - component: frontend
            dockerfile: Dockerfile.frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: enterprise-ai-sql-copilot-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
